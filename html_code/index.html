<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет сотрудника</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../dist/sum.js"></script>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>
    <div class="auth-container">
        <div class="auth-header">
            <h2>Вход в систему</h2>
        </div>
        <form class="auth-form">
            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email" id="email" placeholder="Введите ваш email" required>
            </div>
            <div class="form-group password-toggle">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Введите ваш пароль" required>
                <span class="toggle-password" id="togglePassword"></span>
            </div>
            <button type="submit" class="btn">Войти</button>
        </form>
    </div>
</body>
</html>
